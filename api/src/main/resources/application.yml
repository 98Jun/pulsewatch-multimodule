# =========================================================
# API 모듈 설정 (UTF-8)
# =========================================================
spring:
  threads:
    virtual:
      enabled: true   # ✅ Java21 Virtual Thread 활성화

  datasource:
    # ✅ DB 접속 정보는 여기 적으면 됨
    url: jdbc:mariadb://localhost:3306/pulsewatch
    # ✅ DB 계정/비밀번호
    username: root
    password:
    driver-class-name: org.mariadb.jdbc.Driver

    hikari:
      # ✅ HikariCP 커넥션풀 기본 튜닝(필요 시 조정)
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  kafka:
    # ✅ Kafka 브로커 주소는 여기 적으면 됨
    bootstrap-servers: localhost:9092
    producer:
      acks: all

mybatis:
  mapper-locations: classpath:/mappers/**/*.xml
  type-aliases-package: com.pulsewatch

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: 0J4TPHsyZ6lEHOXdxvMNz56GgyM16ItA4AF9hMv46rg=
  access-token:
    expire-time: 3600000
  refresh-token:
    expire-time: 1209600000

server:
  port: 8080

logging:
  level:
    # ✅ Hikari 로그 확인용(개발 중 디버깅 편의)
    com.zaxxer.hikari: DEBUG
    org.springframework.jdbc: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
