# =========================================================
# WORKER 모듈 설정 (UTF-8)
# =========================================================
spring:
  threads:
    virtual:
      enabled: true

  datasource:
    # ✅ Worker에서 결과 저장/조회가 필요하면 DB 설정을 여기 적으면 됨
    url: jdbc:mariadb://localhost:3306/pulsewatch
    username: root
    password:
    driver-class-name: org.mariadb.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  kafka:
    # ✅ Worker가 소비/발행할 Kafka 브로커
    bootstrap-servers: localhost:9092
    consumer:
      group-id: pulsewatch-worker
      auto-offset-reset: earliest

mybatis:
  mapper-locations: classpath:/mappers/**/*.xml
  type-aliases-package: com.pulsewatch

server:
  port: 8081  # ✅ API와 포트 충돌 방지

logging:
  level:
    com.zaxxer.hikari: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
