# =========================================================
# NOTIFIER 모듈 설정 (UTF-8)
# =========================================================
spring:
  threads:
    virtual:
      enabled: true

  datasource:
    # ✅ Notifier에서 알림 이력 저장이 필요하면 DB 설정을 여기 적으면 됨
    url: jdbc:mariadb://localhost:3306/pulsewatch
    username: root
    password:
    driver-class-name: org.mariadb.jdbc.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  kafka:
    # ✅ Notifier가 소비할 Kafka 브로커
    bootstrap-servers: localhost:9092
    consumer:
      group-id: pulsewatch-notifier
      auto-offset-reset: earliest

mybatis:
  mapper-locations: classpath:/mappers/**/*.xml
  type-aliases-package: com.pulsewatch

server:
  port: 8082  # ✅ API/WORKER와 포트 분리

logging:
  level:
    com.zaxxer.hikari: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
